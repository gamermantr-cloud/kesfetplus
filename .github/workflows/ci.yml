name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r api/requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy
        run: mypy api agents database

      - name: Bandit security scan
        run: bandit -c pyproject.toml -r api agents database

      - name: pip-audit
        run: pip-audit -r api/requirements.txt

  smoke-test:
    runs-on: ubuntu-latest
    # The backend is PostgreSQL-backed (database/db.py) - every store call
    # raises DatabaseNotConfiguredError without a real database, so the
    # smoke test gets a throwaway Postgres service for the job's lifetime.
    services:
      postgres:
        image: postgres:16
        env:
          # CI-only throwaway password for an ephemeral container - not a secret.
          POSTGRES_PASSWORD: ci-smoke-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-smoke-test@localhost:5432/postgres
      # Moderation-panel gate (see database/users_store.py) - the smoke test
      # deliberately never exercises /moderation/* endpoints, but the
      # backend reads this at request time regardless, so it's defined
      # explicitly (empty = no moderator accounts) rather than left unset.
      MODERATOR_EMAILS: ""
      # The photo-compare scenario makes real calls to Wikimedia Commons and
      # is rate-limit-flaky by nature (see kesfetplus-smoke-test SKILL.md) -
      # skip it in CI so external flakiness never fails an unrelated PR.
      SKIP_PHOTO_COMPARE: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r api/requirements.txt

      # Same one-liner database/schema.sql's header documents - psycopg is
      # already installed above, so no extra postgresql-client apt install.
      - name: Apply database schema
        run: |
          python -c "import os, psycopg; psycopg.connect(os.environ['DATABASE_URL'], autocommit=True).execute(open('database/schema.sql', encoding='utf-8').read())"

      - name: Start backend (uvicorn, background)
        run: |
          nohup python -m uvicorn api.main:app --host 127.0.0.1 --port 8000 \
            > backend.log 2>&1 &

      - name: Backend saglik kontrolu bekleniyor
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "Backend hazir (deneme $i)."
              exit 0
            fi
            sleep 1
          done
          echo "Backend 30 saniye icinde ayaga kalkmadi."
          cat backend.log || true
          exit 1

      - name: Smoke test calistir (foto-karsilastirma haric)
        run: python .claude/skills/kesfetplus-smoke-test/scripts/smoke_test.py

      - name: Backend loglari (basarisizlik durumunda)
        if: failure()
        run: cat backend.log || true
