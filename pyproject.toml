[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "S", "B", "UP"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"agents/scout_agent.py" = ["S113"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[tool.bandit]
exclude_dirs = ["venv", ".venv"]
